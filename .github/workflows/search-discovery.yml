name: Notify IndexNow after verified production deployment
# A deployment_status event fires repeatedly (including non-production status
# changes). Its environment name was unreliable, leaving most jobs skipped.
# Poll the deployed revision at a low frequency instead and notify only once
# per changed release. No additional Vercel deployments are triggered.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atmosferi-indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify the commit actually deployed to production
        id: live
        run: node scripts/resolve-indexnow-release.mjs
      - name: Check out the deployed commit (not a newer pending change)
        if: steps.live.outputs.ready == 'true'
        env:
          DEPLOYED_SHA: ${{ steps.live.outputs.sha }}
        run: git checkout --detach "$DEPLOYED_SHA"
      - name: Generate the exact release sitemap and verify page metadata
        if: steps.live.outputs.ready == 'true'
        run: npm run prebuild
      - name: Check IndexNow payload without submitting
        if: steps.live.outputs.ready == 'true'
        run: node scripts/notify-indexnow.mjs --dry-run
      - name: Restore receipt for previously notified content
        if: steps.live.outputs.ready == 'true'
        id: receipt
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-success-receipt
          key: indexnow-${{ hashFiles('sitemap.xml', '*.html', 'demos/atmosferi-viz/index.html') }}
      - name: Notify IndexNow only when publication has changed
        if: steps.live.outputs.ready == 'true' && steps.receipt.outputs.cache-hit != 'true'
        run: node scripts/notify-indexnow.mjs
      - name: Record successful notification
        if: steps.live.outputs.ready == 'true' && steps.receipt.outputs.cache-hit != 'true'
        env:
          DEPLOYED_SHA: ${{ steps.live.outputs.sha }}
        run: printf 'IndexNow accepted publication %s\n' "$DEPLOYED_SHA" > .indexnow-success-receipt
      - name: Cache successful notification receipt
        if: steps.live.outputs.ready == 'true' && steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .indexnow-success-receipt
          key: indexnow-${{ hashFiles('sitemap.xml', '*.html', 'demos/atmosferi-viz/index.html') }}
