name: Notify search engines after production deployment
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-search-discovery
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-international-seo.mjs
      - run: node scripts/notify-indexnow.mjs
