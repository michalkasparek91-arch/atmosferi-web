name: Validate SEO content
on:
  pull_request:
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/seo-content-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate SEO pages and sitemap
        run: npm run prebuild
      - name: Validate international SEO
        run: npm run seo:check
      - name: Validate editorial article
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pages = [
            ['prepare-architecture-projects-for-website.html', 'en', 'services.html'],
            ['struktura-webu-architektonickeho-atelieru.html', 'cs', 'weby-pro-architekty.html'],
