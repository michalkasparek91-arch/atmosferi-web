name: Validate SEO content
on:
  pull_request:
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/seo-content-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate SEO pages and sitemap
        run: npm run prebuild
      - name: Validate international SEO
        run: npm run seo:check
      - name: Validate editorial article
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pages = [
            ['prepare-architecture-projects-for-website.html', 'en', 'services.html'],
            ['struktura-webu-architektonickeho-atelieru.html', 'cs', 'weby-pro-architekty.html'],
            ['architekturbuero-website-relaunch-checkliste.html', 'de', 'webdesign-fuer-architekten.html'],
            ['tilgjengelig-nettside-for-arkitektkontor.html', 'nb', 'nettsider-for-arkitekter.html'],
            ['residential-development-website-content-checklist.html', 'en', 'websites-for-architects.html'],
            ['architekturleistungen-auf-website-darstellen.html', 'de', 'architekturbuero-website-relaunch-checkliste.html'],
            ['cms-for-architecture-portfolio-website.html', 'en', 'prepare-architecture-projects-for-website.html'],
            ['interactive-floor-plans-property-development-website.html', 'en', 'residential-development-website-content-checklist.html'],
            ['architecture-portfolio-image-optimization.html', 'en', 'prepare-architecture-projects-for-website.html', '2026-11-02'],
            ['architecture-portfolio-website-url-migration.html', 'en', 'cms-for-architecture-portfolio-website.html', '2026-11-02'],
            ['bim-cad-handover-architectural-visualisation.html', 'en', 'services.html', '2026-11-02'],
            ['architectural-rendering-feedback-revision-checklist.html', 'en', 'bim-cad-handover-architectural-visualisation.html', '2026-11-02']
          ];
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          for (const [path, lang, incoming, published = '2026-11-01'] of pages) {
            const url = 'https://www.atmosferi.com/' + path;
            const h = fs.readFileSync(path, 'utf8');
            assert(h.includes('<html lang="' + lang + '">'), path + ': lang');
            assert.equal((h.match(/<h1[\s>]/g) || []).length, 1, path + ': H1');
            assert(h.includes('<link rel="canonical" href="' + url + '">'), path + ': canonical');
            assert(h.includes('<meta name="robots" content="index, follow'), path + ': robots');
            assert(h.includes('<meta name="viewport"'), path + ': viewport');
            for (const css of ['assets/site.css', 'assets/redesign.css', 'assets/brand-header.css', 'assets/seo-services.css', 'assets/seo-guides.css']) {
              assert(h.includes('href="' + css), path + ': stylesheet ' + css);
            }
            for (const meta of ['og:title', 'og:description', 'og:url', 'twitter:card', 'twitter:title', 'twitter:description']) {
              assert(h.includes(meta), path + ': social metadata ' + meta);
            }
            assert(sitemap.includes('<loc>' + url + '</loc>'), path + ': sitemap');
            assert(!/rel="alternate" hreflang=/.test(h), path + ': unreviewed translation alternates');
            assert(fs.readFileSync(incoming, 'utf8').includes('href="' + path + '"'), path + ': incoming link');
            const schema = JSON.parse(h.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/)[1]);
            assert(schema['@graph'].some(item => item['@type'] === 'WebPage' && item.inLanguage === lang));
            assert(schema['@graph'].some(item => item['@type'] === 'Article' && item.inLanguage === lang));
            assert(schema['@graph'].some(item => item['@type'] === 'Article' && item.datePublished === published && item.dateModified === published), path + ': publication dates');
            if (path === 'architecture-portfolio-image-optimization.html') {
              assert(h.includes('class="wrap guide-main"'), path + ': responsive guide layout');
              assert(/@media\s*\(max-width:850px\)/.test(fs.readFileSync('assets/seo-guides.css', 'utf8')), path + ': mobile breakpoint');
              assert(h.includes('https://developer.mozilla.org/'), path + ': technical references');
            }
            if (path === 'architecture-portfolio-website-url-migration.html') {
              assert(h.includes('class="wrap guide-main"'), path + ': responsive guide layout');
              assert(/@media\s*\(max-width:850px\)/.test(fs.readFileSync('assets/seo-guides.css', 'utf8')), path + ': mobile breakpoint');
              assert(h.includes('property="og:url" content="' + url + '"'), path + ': OG URL');
              assert(h.includes('fictional examples'), path + ': fictional redirect map');
              assert(h.includes('https://developers.google.com/search/docs/crawling-indexing/301-redirects'), path + ': authoritative redirect reference');
              assert(h.includes('https://developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes'), path + ': authoritative migration reference');
              assert((h.match(/<section id=/g) || []).length >= 7, path + ': substantive editorial sections');
              const nodes = schema['@graph'];
              assert(nodes.some(item => item['@type'] === 'WebPage' && item.url === url), path + ': schema page URL');
              assert(nodes.some(item => item['@type'] === 'Article' && item.mainEntityOfPage['@id'] === url + '#webpage'), path + ': schema article relationship');
            }
            if (path === 'bim-cad-handover-architectural-visualisation.html') {
              assert(h.includes('class="wrap guide-main"'), path + ': responsive guide layout');
              assert(/@media\s*\(max-width:850px\)/.test(fs.readFileSync('assets/seo-guides.css', 'utf8')), path + ': mobile breakpoint');
              assert((h.match(/<section id=/g) || []).length >= 9, path + ': substantive sections');
              assert(h.includes('Fictional package layout') && h.includes('Fictional material decision log'), path + ': fictional examples labelled');
              assert(h.includes('https://up1.autodesk.com/2026/RVT/ADSKIFCExporterHelp_26_1.htm'), path + ': official exporter reference');
              assert(h.includes('https://helpcenter.graphisoft.com/user-guide/137853/'), path + ': official IFC reference');
              const nodes = schema['@graph'];
              assert(nodes.some(item => item['@type'] === 'WebPage' && item.url === url), path + ': schema page URL');
              assert(nodes.some(item => item['@type'] === 'Article' && item.mainEntityOfPage['@id'] === url + '#webpage'), path + ': schema article relationship');
              assert(h.includes('property="og:url" content="' + url + '"'), path + ': OG URL');
            }
            if (path === 'architectural-rendering-feedback-revision-checklist.html') {
              assert(h.includes('class="wrap guide-main"'), path + ': responsive guide layout');
              assert(/@media\\s*\\(max-width:850px\\)/.test(fs.readFileSync('assets/seo-guides.css', 'utf8')), path + ': mobile breakpoint');
              assert((h.match(/<section id=/g) || []).length >= 9, path + ': substantive sections');
              assert(h.includes('Fictional revision register') && h.includes('Fictional annotation'), path + ': illustrative examples labelled');
              assert(h.includes('property="og:url" content="' + url + '"'), path + ': OG URL');
              assert(schema['@graph'].some(item => item['@type'] === 'WebPage' && item.url === url), path + ': schema page URL');
              assert(schema['@graph'].some(item => item['@type'] === 'Article' && item.mainEntityOfPage['@id'] === url + '#webpage'), path + ': schema article relationship');
            }
            const local = [...h.matchAll(/(?:href|src)="([^"#?]+)(?:[?#][^"]*)?"/g)].map(m => m[1]);
            for (const link of local) {
              if (/^(?:https?:|mailto:)/.test(link)) continue;
              assert(fs.existsSync(link.replace(/^\//, '')), path + ': broken local link ' + link);
            }
          }
          console.log('Editorial pages: canonical, sitemap, schema and links passed.');
          NODE
